<style>

  html,body{margin:0;background:var(--bg);color:var(--text);

  button,input,textarea,select{font:inherit;color:inherit}

    border-bottom:1px solid var(--line)}

  .sub{color:var(--muted);margin:0 0 16px}
  .crumb{color:var(--muted);font-size:14px;margin-top:14px}

  .empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:var(--r)}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;

  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);

  .stat{font-variant-numeric:tabular-nums}

  .att button:hover{border-color:#3d4560;color:var(--text)}
  .att button.on.present{background:var(--ok);border-color:var(--ok);color:#0E111C;font-weight:700}

/* ---------------- utilidades ---------------- */

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtText = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
const fmtDate = d => d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('es', {weekday:'short', day:'numeric', month:'short'}) : '';
const fmtWhen = ts => new Date(ts).toLocaleString('es', {day:'numeric', month:'short', hour:'numeric', minute:'2-digit'});
const ytIds = s => [...new Set([...String(s || '').matchAll(/(?:youtube\.com\/(?:watch\?\S*?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/g)].map(m => m[1]))];

const coverUrl = u => esc(encodeURI(String(u || '').trim()).replace(/'/g, '%27'));

const pad2 = n => String(n).padStart(2, '0');

/* ---------------- API: Supabase ---------------- */
function supabaseApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const q = async p => { const {data, error} = await p; if (error) throw error; return data; };
  const save = (table, obj, fields) => {
    const row = {}; fields.forEach(f => { if (f in obj) row[f] = obj[f]; });
    return obj.id ? q(sb.from(table).update(row).eq('id', obj.id).select().single())
                  : q(sb.from(table).insert(row).select().single());
  };
  return {
    onAuth(cb){ sb.auth.onAuthStateChange((ev, session) => setTimeout(() => cb(ev, session?.user || null), 0)); },
    signIn: (email, password) => q(sb.auth.signInWithPassword({email, password})),
    signUp: (email, password, full_name, join_code) => q(sb.auth.signUp({email, password, options:{data:{full_name, join_code}, emailRedirectTo: baseUrl()}})),
    checkJoinCode: code => q(sb.rpc('check_join_code', {p_code: code})),
    // Invitación: crea la cuenta del estudiante (ya inscrito por email) y le llega un correo de On the Wave
    async inviteStudent(email, course_title){
      const inv = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY,
        {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'otw-invite'}});
      return q(inv.auth.signInWithOtp({email, options: {shouldCreateUser: true, emailRedirectTo: baseUrl(),
        data: {invited: true, needs_password: true, course_title}}}));
    },
    finishInvite: (password, full_name) => q(sb.auth.updateUser({password, data: {needs_password: false, full_name}})),
    joinCourse: code => q(sb.rpc('join_course', {p_code: code})),
    resetPassword: email => q(sb.auth.resetPasswordForEmail(email, {redirectTo: baseUrl()})),
    updatePassword: password => q(sb.auth.updateUser({password})),
    signOut: () => sb.auth.signOut(),
    profile: id => q(sb.from('profiles').select('*').eq('id', id).single()),
    updateName: (id, full_name) => q(sb.from('profiles').update({full_name}).eq('id', id)),
    profiles: () => q(sb.from('profiles').select('*')),
    courses: () => q(sb.from('courses').select('*').order('created_at')),
    saveCourse: c => save('courses', c, ['title','description','color','archived','join_code','join_enabled','image_url']),
    deleteCourse: id => q(sb.from('courses').delete().eq('id', id)),
    enrollments: courseId => q(sb.from('enrollments').select('*').eq('course_id', courseId).order('email')),
    allEnrollments: () => q(sb.from('enrollments').select('*')),
    addEnrollments: (course_id, emails) => q(sb.from('enrollments')
      .upsert(emails.map(email => ({course_id, email})), {onConflict:'course_id,email', ignoreDuplicates:true})),
    removeEnrollment: id => q(sb.from('enrollments').delete().eq('id', id)),
    assignments: courseId => q(sb.from('assignments').select('*').eq('course_id', courseId).order('week').order('created_at')),
    allAssignments: () => q(sb.from('assignments').select('*').order('week')),
    assignment: id => q(sb.from('assignments').select('*').eq('id', id).single()),
    course: id => q(sb.from('courses').select('*').eq('id', id).single()),
    saveAssignment: a => save('assignments', a, ['course_id','week','title','instructions','due_date','published']),
    deleteAssignment: id => q(sb.from('assignments').delete().eq('id', id)),
    sessions: courseId => q(sb.from('sessions').select('*').eq('course_id', courseId).order('starts_at')),
    session: id => q(sb.from('sessions').select('*').eq('id', id).single()),
    saveSession: s => save('sessions', s, ['course_id','starts_at','title','notes']),
    deleteSession: id => q(sb.from('sessions').delete().eq('id', id)),
    attendance: sessionIds => q(sb.from('attendance').select('*').in('session_id', sessionIds.length ? sessionIds : ['00000000-0000-0000-0000-000000000000'])),
    setAttendance: (session_id, email, status) => status
      ? q(sb.from('attendance').upsert({session_id, email, status, updated_at: new Date().toISOString()}, {onConflict: 'session_id,email'}))
      : q(sb.from('attendance').delete().eq('session_id', session_id).eq('email', email)),
    messages(f = {}){
      let r = sb.from('journal_messages').select('*').order('created_at');
      if (f.assignment_id) r = r.eq('assignment_id', f.assignment_id);
      if (f.assignment_ids) r = r.in('assignment_id', f.assignment_ids.length ? f.assignment_ids : ['00000000-0000-0000-0000-000000000000']);
      if (f.student_id) r = r.eq('student_id', f.student_id);
      return q(r);
    },
    async sendMessage({assignment_id, student_id, author_id, body, file}){
      let file_path = null, file_name = null, file_type = null;
      if (file){
        const safe = file.name.normalize('NFD').replace(/[^\w.\-]+/g, '_');
        file_path = `${student_id}/${assignment_id}/${Date.now()}-${safe}`;
        await q(sb.storage.from('journal').upload(file_path, file, {contentType: file.type}));
        file_name = file.name; file_type = file.type;
      }
      return q(sb.from('journal_messages').insert({assignment_id, student_id, author_id, body, file_path, file_name, file_type}).select().single());
    },
    async deleteMessage(m){
      if (m.file_path) await sb.storage.from('journal').remove([m.file_path]);
      return q(sb.from('journal_messages').delete().eq('id', m.id));
    },
    async fileUrls(paths){
      if (!paths.length) return {};
      const data = await q(sb.storage.from('journal').createSignedUrls(paths, 3600));
      return Object.fromEntries(data.filter(d => d.signedUrl).map(d => [d.path, d.signedUrl]));
    }
  };
}

    {id:'a2', course_id:'c1', week:2, title:'Practice Journal · Semana 2', due_date:new Date(now+9*day).toISOString().slice(0,10), published:false, created_at:iso(now-1*day),
      instructions:'Transiciones con EQ: baja los graves del track entrante y súbelos en el drop.'},
    {id:'a3', course_id:'c2', week:1, title:'Tu primer loop en Session View', due_date:null, published:true, created_at:iso(now-5*day),
      instructions:'Crea un loop de 8 compases con batería, bajo y un acorde. Sube un audio o video corto.'}
  ];
  const M = [
    {id:'m1', assignment_id:'a1', student_id:'s1', author_id:'s1', body:'¡Hola Caro! Ya practiqué 4 días. Lo más difícil fue escuchar cuál track iba más rápido.', created_at:iso(now-2*day)},
    {id:'m2', assignment_id:'a1', student_id:'s1', author_id:'t1', body:'¡Vas muy bien Ana! Truco: usa los audífonos solo en un oído y compara los kicks.', created_at:iso(now-1.8*day)},
    {id:'m3', assignment_id:'a1', student_id:'s2', author_id:'s2', body:'Aquí va mi mezcla de la semana. Me costó el pitch fader.', created_at:iso(now-3*3600e3)}
  ];
  const SS = [
    {id:'ss1', course_id:'c1', starts_at:iso(now-7*day), title:'Clase 1 · Beatmatching', notes:''},
    {id:'ss2', course_id:'c1', starts_at:iso(now+1*day), title:'Clase 2 · Transiciones con EQ', notes:''}];
  const AT = [{session_id:'ss1', email:'ana@ejemplo.com', status:'present'}, {session_id:'ss1', email:'luis@ejemplo.com', status:'late'}];
  let me = P[0], cb = null;
  const wait = v => new Promise(r => setTimeout(() => r(structuredClone(v)), 60));
  const upsert = (arr, obj) => {
    if (obj.id){ const i = arr.findIndex(x => x.id === obj.id); arr[i] = {...arr[i], ...obj}; return wait(arr[i]); }
    const row = {...obj, id: uid(), created_at: iso(Date.now())}; arr.push(row); return wait(row);
  };
  const mine = () => me.role === 'teacher' ? C : C.filter(c => E.some(e => e.course_id === c.id && e.email === me.email));
  return {
    demo: true,
    setRole(r){ me = r === 'teacher' ? P[0] : P[1]; cb && cb('SIGNED_IN', {id: me.id, email: me.email}); },
    get role(){ return me.role; },
    onAuth(f){ cb = f; setTimeout(() => f('INITIAL_SESSION', {id: me.id, email: me.email}), 0); },
    signIn: async () => {}, signUp: async () => {},
    inviteStudent: async () => {}, finishInvite: async () => {},
    checkJoinCode: async code => C.some(c => c.join_code === code && c.join_enabled && !c.archived),
    joinCourse: async code => { const c = C.find(c => c.join_code === code && c.join_enabled && !c.archived);
      if (!c) throw new Error('OTW_INVALID_CODE');
      if (!E.some(e => e.course_id === c.id && e.email === me.email)) E.push({id: uid(), course_id: c.id, email: me.email}); return c.id; }, resetPassword: async () => {}, updatePassword: async () => {},
    signOut: async () => toast('En el modo demo no se cierra sesión'),
    profile: id => wait(P.find(p => p.id === id)),
    updateName: (id, n) => { P.find(p => p.id === id).full_name = n; return wait(null); },
    profiles: () => wait(me.role === 'teacher' ? P : [me]),
    courses: () => wait(mine()),
    course: id => wait(mine().find(c => c.id === id)),
    saveCourse: c => upsert(C, c.id ? c : {join_code: genCode(), join_enabled: true, ...c}),
    deleteCourse: id => { C.splice(C.findIndex(c => c.id === id), 1); return wait(null); },
    enrollments: cid => wait(E.filter(e => e.course_id === cid && (me.role === 'teacher' || e.email === me.email))),
    allEnrollments: () => wait(E),
    addEnrollments: (cid, emails) => { emails.forEach(email => { if (!E.some(e => e.course_id === cid && e.email === email)) E.push({id: uid(), course_id: cid, email}); }); return wait(null); },
    removeEnrollment: id => { E.splice(E.findIndex(e => e.id === id), 1); return wait(null); },
    assignments: cid => wait(A.filter(a => a.course_id === cid && (me.role === 'teacher' || a.published)).sort((x, y) => x.week - y.week)),
    allAssignments: () => wait(A),
    assignment: id => wait(A.find(a => a.id === id && (me.role === 'teacher' || a.published))),
    saveAssignment: a => upsert(A, a),
    deleteAssignment: id => { A.splice(A.findIndex(a => a.id === id), 1); return wait(null); },
    sessions: cid => wait(SS.filter(x => x.course_id === cid).sort((a, b) => a.starts_at.localeCompare(b.starts_at))),
    session: id => wait(SS.find(x => x.id === id)),
    saveSession: x => upsert(SS, x),
    deleteSession: id => { SS.splice(SS.findIndex(x => x.id === id), 1); return wait(null); },
    attendance: ids => wait(AT.filter(a => ids.includes(a.session_id) && (me.role === 'teacher' || a.email === me.email))),
    setAttendance: (session_id, email, status) => { const i = AT.findIndex(a => a.session_id === session_id && a.email === email);
      if (i >= 0) AT.splice(i, 1); if (status) AT.push({session_id, email, status}); return wait(null); },
    messages: (f = {}) => wait(M.filter(m =>
      (!f.assignment_id || m.assignment_id === f.assignment_id) &&
      (!f.assignment_ids || f.assignment_ids.includes(m.assignment_id)) &&
      (!f.student_id || m.student_id === f.student_id) &&
      (me.role === 'teacher' || m.student_id === me.id))),
    sendMessage: ({assignment_id, student_id, author_id, body, file}) => {
      const m = {id: uid(), assignment_id, student_id, author_id, body, created_at: iso(Date.now()),
        file_path: file ? URL.createObjectURL(file) : null, file_name: file?.name || null, file_type: file?.type || null};
      M.push(m); return wait(m);
    },
    deleteMessage: m => { M.splice(M.findIndex(x => x.id === m.id), 1); return wait(null); },
    fileUrls: async paths => Object.fromEntries(paths.map(p => [p, p]))
  };
}

function genCode(){ const ch = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let c = 'OTW-';
  const r = crypto.getRandomValues(new Uint32Array(6)); r.forEach(x => c += ch[x % ch.length]); return c; }
const api = DEMO ? demoApi() : supabaseApi();
const S = { user: null, profile: null, recovery: false, authMode: 'login', code: '' };

/* ---------------- estado de un hilo de journal ---------------- */
// pending = sin respuesta del estudiante · review = último mensaje del estudiante · done = último mensaje de la profe
function threadStatus(msgs, studentId){
  if (!msgs || !msgs.some(m => m.author_id === studentId)) return 'pending';
  return msgs[msgs.length - 1].author_id === studentId ? 'review' : 'done';
}

/* ---------------- arranque y router ---------------- */
api.onAuth(async (ev, user) => {
  if (ev === 'PASSWORD_RECOVERY') S.recovery = true;
  const changed = (user?.id || null) !== (S.user?.id || null);
  if (!changed && ev !== 'PASSWORD_RECOVERY' && ev !== 'INITIAL_SESSION') return;
  S.user = user;
  S.profile = user ? await api.profile(user.id).catch(() => null) : null;
  render();
});
window.addEventListener('hashchange', render);

let renderSeq = 0;
async function render(){
  const seq = ++renderSeq;
  const app = $('#app');
  if (!S.user) { app.innerHTML = authView(); bindAuth(); return; }
  if (S.recovery) { app.innerHTML = shell(recoveryView()); bindRecovery(); return; }
  if (S.user.user_metadata?.needs_password) { app.innerHTML = shell(welcomeView()); bindWelcome(); return; }
  if (!S.profile) { app.innerHTML = shell(`<div class="empty">No encontramos tu perfil. Si acabas de configurar la base de datos, cierra sesión y vuelve a registrarte.</div>`); bindShell(); return; }
  app.innerHTML = shell(`<p class="note" style="margin-top:24px">Cargando…</p>`); bindShell();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  let html;
  try {
    if (parts[0] === 'curso' && parts[2] === 'clase' && parts[3] && isTeacher()) html = await attendanceView(parts[1], parts[3]);
    else if (parts[0] === 'curso' && parts[1])      html = isTeacher() ? await teacherCourse(parts[1], parts[2] || 'tareas') : await studentCourse(parts[1]);
    else if (parts[0] === 'tarea' && parts[3]) html = await threadView(parts[1], parts[3]);
    else if (parts[0] === 'tarea' && parts[1]) html = isTeacher() ? await teacherAssignment(parts[1]) : await threadView(parts[1], S.user.id);
    else if (parts[0] === 'perfil')            html = profileView();
    else                                       html = isTeacher() ? await teacherHome() : await studentHome();
  } catch (e) {
    console.error(e);
    html = `<div class="empty">No se pudo cargar esta página.<br><span class="note">${esc(errMsg(e))}</span><br><br><a href="#/">Volver al inicio</a></div>`;
  }
  if (seq !== renderSeq) return;
  app.innerHTML = shell(html);
  bindShell(); bindPage();
}

function bindAuth(){

    const email = String(f.get('email')).trim().toLowerCase();
    btn.disabled = true; err.textContent = '';

      else if (S.authMode === 'signup') {
        const code = normCode(f.get('code'));
        if (code && !(await api.checkJoinCode(code))) throw new Error('OTW_INVALID_CODE');

async function teacherHome(){
  const [courses, assignments, msgs, profiles, enrolls] = await Promise.all([api.courses(), api.allAssignments(), api.messages(), api.profiles(), api.allEnrollments()]);
  const A = Object.fromEntries(assignments.map(a => [a.id, a]));
  const Cm = Object.fromEntries(courses.map(c => [c.id, c]));
  const Pm = Object.fromEntries(profiles.map(p => [p.id, p]));
  const threads = groupBy(msgs, m => m.assignment_id + '|' + m.student_id);
  const toReview = Object.values(threads)
    .filter(t => threadStatus(t, t[0].student_id) === 'review' && A[t[0].assignment_id])
    .map(t => t[t.length - 1]).sort((a, b) => b.created_at.localeCompare(a.created_at));
  const active = courses.filter(c => !c.archived), archived = courses.filter(c => c.archived);
  const card = c => {
    const n = enrolls.filter(e => e.course_id === c.id).length;
    const t = assignments.filter(a => a.course_id === c.id).length;
    return `<a class="card course-card" href="#/curso/${c.id}"><div class="bar" style="background:${esc(c.color)}"></div>${coverDiv(c.image_url, 'cover')}
      <h3>${esc(c.title)}</h3><p>${n} estudiante${n===1?'':'s'} · ${t} tarea${t===1?'':'s'}</p></a>`;
  };
  return `<h1>Hola, ${esc(S.profile.full_name.split(' ')[0] || 'profe')} 👋</h1>
  <p class="sub">Esto es lo que tienes pendiente.</p>
  <h2>Por revisar <span class="badge ${toReview.length ? 'new' : ''}">${toReview.length}</span></h2>
  ${toReview.length ? `<div class="list">${toReview.map(m => {
      const a = A[m.assignment_id], c = Cm[a.course_id], p = Pm[m.student_id];
      return `<a class="row" href="#/tarea/${a.id}/e/${m.student_id}">
        <div class="grow"><b>${esc(p?.full_name || p?.email || 'Estudiante')}</b> · ${esc(a.title)}
        <div class="meta">${esc(c?.title || '')} · ${fmtWhen(m.created_at)}${m.file_path ? ' · 🎧 audio' : ''}${ytIds(m.body).length ? ' · ▶ video' : ''}</div></div>
        <span class="badge warn">Responder</span></a>`; }).join('')}</div>`

  ${archived.length ? `<h2>Archivados</h2><div class="grid">${archived.map(card).join('')}</div>` : ''}`;
}

async function teacherCourse(id, tab){
  const [course, assignments, enrolls, profiles] = await Promise.all([api.course(id), api.assignments(id), api.enrollments(id), api.profiles()]);
  const msgs = await api.messages({assignment_ids: assignments.map(a => a.id)});
  PAGE.course = course; PAGE.assignments = assignments;
  const byEmail = Object.fromEntries(profiles.map(p => [p.email, p]));
  const studentIds = new Set(enrolls.map(e => byEmail[e.email]?.id).filter(Boolean));
  const head = `<div class="crumb"><a href="#/">Inicio</a> / Curso</div>${coverDiv(course.image_url, 'course-cover')}
    <h1 style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:${esc(course.color)}"></span>${esc(course.title)}</h1>
    <p class="sub">${esc(course.description)} ${course.archived ? '<span class="badge">Archivado</span>' : ''}</p>
    <div class="actions" style="margin-top:0"><button class="btn small" data-act="edit-course">Editar curso</button></div>
    <nav class="tabs"><a href="#/curso/${id}" class="${tab==='tareas'?'on':''}">Tareas</a><a href="#/curso/${id}/clases" class="${tab==='clases'?'on':''}">Clases y asistencia</a><a href="#/curso/${id}/estudiantes" class="${tab==='estudiantes'?'on':''}">Estudiantes (${enrolls.length})</a></nav>`;

  if (tab === 'clases'){
    const sessions = await api.sessions(id);
    PAGE.sessions = sessions;
    const att = await api.attendance(sessions.map(x => x.id));
    const bySes = groupBy(att, a => a.session_id);
    const nowIso = new Date().toISOString();
    const row = x => { const a = bySes[x.id] || []; const pres = a.filter(r => r.status === 'present' || r.status === 'late').length;
      const past = x.starts_at <= nowIso;
      return `<a class="row" href="#/curso/${id}/clase/${x.id}">${dateChip(x.starts_at)}
        <div class="grow"><b>${esc(x.title || 'Clase')}</b><div class="meta">${esc(fmtSession(x.starts_at))}</div></div>
        ${a.length ? `<span class="badge ok"><span class="stat">${pres}/${enrolls.length}</span> asistieron</span>` : (past ? '<span class="badge warn">Tomar asistencia</span>' : '<span class="badge">Próxima</span>')}</a>`; };
    const upcoming = sessions.filter(x => x.starts_at > nowIso), past = sessions.filter(x => x.starts_at <= nowIso).reverse();
    return head + `<div class="actions" style="margin-top:0"><button class="btn primary" data-act="new-session">+ Nueva clase</button>
      ${sessions.length ? '<button class="btn" data-act="new-sessions-weekly">+ Varias clases (semanal)</button>' : '<button class="btn" data-act="new-sessions-weekly">+ Crear todas las clases del ciclo</button>'}</div>
      ${!sessions.length ? '<div class="empty">Agrega las clases del curso (fecha, hora y tema). Después, en cada clase, tomas asistencia con un toque.</div>' : ''}
      ${upcoming.length ? `<div class="week">Próximas</div><div class="list">${upcoming.map(row).join('')}</div>` : ''}
      ${past.length ? `<div class="week">Pasadas</div><div class="list">${past.map(row).join('')}</div>` : ''}`;
  }

  if (tab === 'estudiantes'){
    const sesAll = await api.sessions(id); const nowIso = new Date().toISOString();
    const pastIds = sesAll.filter(x => x.starts_at <= nowIso).map(x => x.id);
    const attAll = pastIds.length ? await api.attendance(pastIds) : [];
    const attBy = groupBy(attAll, a => a.email);
    const attLabel = em => { if (!pastIds.length) return ''; const r = attBy[em] || []; const n = r.filter(x => x.status === 'present' || x.status === 'late').length;
      return `<span class="badge" title="Clases a las que asistió">🎧 ${n}/${pastIds.length} clases</span>`; };
    return head + `
    <div class="card code-card"><div class="note">Código de inscripción</div>
      <div class="code ${course.join_enabled ? '' : 'off'}">${esc(course.join_code)}</div>
      <p class="note" style="margin:6px 0 0">${course.join_enabled

        <button class="btn" data-act="copy-link">Copiar link del campus</button></div></details>

    ${enrolls.length ? `<div class="list">${enrolls.map(e => { const p = byEmail[e.email]; return `<div class="row">
      <div class="grow"><b>${esc(p?.full_name || e.email)}</b><div class="meta">${esc(e.email)}</div></div>
      ${attLabel(e.email)}
      ${p ? '<span class="badge ok">Cuenta activa</span>' : `<span class="badge">Aún sin cuenta</span> <button class="btn small" data-act="invite" data-id="${esc(e.email)}">✉️ Enviar invitación</button>`}
      <button class="btn small danger" data-act="unenroll" data-id="${e.id}">Quitar</button></div>`; }).join('')}</div>`
      : `<div class="empty">Nadie inscrito todavía.</div>`}`;
  }

  const threads = groupBy(msgs, m => m.assignment_id + '|' + m.student_id);
  const weeks = groupBy(assignments, a => a.week);
  return head + `
  <div class="actions" style="margin-top:0"><button class="btn primary" data-act="new-assignment">+ Nueva tarea</button></div>
  ${assignments.length ? Object.keys(weeks).sort((a, b) => a - b).map(w => `<div class="week">Semana ${w}</div><div class="list">${weeks[w].map(a => {
      let answered = 0, review = 0;
      studentIds.forEach(sid => { const st = threadStatus(threads[a.id + '|' + sid], sid); if (st !== 'pending') answered++; if (st === 'review') review++; });
      return `<div class="row"><div class="grow"><a href="#/tarea/${a.id}"><b>${esc(a.title)}</b></a>
        <div class="meta">${a.due_date ? 'Entrega: ' + fmtDate(a.due_date) + ' · ' : ''}<span class="stat">${answered}/${studentIds.size}</span> respondieron</div></div>
        ${review ? `<span class="badge new">${review} por revisar</span>` : ''}
        ${a.published ? '<span class="badge ok">Publicada</span>' : '<span class="badge">Borrador</span>'}
        <button class="btn small hide-sm" data-act="edit-assignment" data-id="${a.id}">Editar</button>
        <button class="btn small" data-act="dup-assignment" data-id="${a.id}">Duplicar</button></div>`; }).join('')}</div>`).join('')
    : `<div class="empty">Crea la primera tarea de la semana. Puedes dejarla como borrador y publicarla cuando quieras.</div>`}`;
}

async function teacherAssignment(id){
  const a = await api.assignment(id);
  const [course, enrolls, profiles, msgs] = await Promise.all([api.course(a.course_id), api.enrollments(a.course_id), api.profiles(), api.messages({assignment_id: id})]);
  PAGE.course = course; PAGE.assignment = a;
  const byEmail = Object.fromEntries(profiles.map(p => [p.email, p]));
  const threads = groupBy(msgs, m => m.student_id);
  const order = {review: 0, done: 1, pending: 2, nouser: 3};
  const rows = enrolls.map(e => { const p = byEmail[e.email]; const st = p ? threadStatus(threads[p.id], p.id) : 'nouser'; return {e, p, st, last: p && threads[p.id]?.slice(-1)[0]}; })
    .sort((x, y) => order[x.st] - order[y.st]);
  const label = {review: '<span class="badge new">Por revisar</span>', done: '<span class="badge ok">Respondido</span>', pending: '<span class="badge">Sin respuesta</span>', nouser: '<span class="badge">Aún sin cuenta</span>'};
  return `<div class="crumb"><a href="#/">Inicio</a> / <a href="#/curso/${course.id}">${esc(course.title)}</a></div>
  <h1>${esc(a.title)}</h1>
  <p class="sub">Semana ${a.week}${a.due_date ? ' · Entrega: ' + fmtDate(a.due_date) : ''} · ${a.published ? '<span class="badge ok">Publicada</span>' : '<span class="badge">Borrador — los estudiantes aún no la ven</span>'}</p>
  <div class="instructions">${fmtText(a.instructions) || '<span class="note">Sin instrucciones.</span>'}</div>
  <div class="actions"><button class="btn" data-act="edit-assignment" data-id="${a.id}">Editar</button>
    <button class="btn" data-act="toggle-publish" data-id="${a.id}">${a.published ? 'Volver a borrador' : 'Publicar'}</button>
    <button class="btn" data-act="dup-assignment" data-id="${a.id}">Duplicar</button></div>
  <h2>Journals de estudiantes</h2>
  ${rows.length ? `<div class="list">${rows.map(r => r.p ? `<a class="row" href="#/tarea/${a.id}/e/${r.p.id}">
      <div class="grow"><b>${esc(r.p.full_name || r.p.email)}</b><div class="meta">${r.last ? 'Último mensaje: ' + fmtWhen(r.last.created_at) : esc(r.p.email)}</div></div>${label[r.st]}</a>`
    : `<div class="row"><div class="grow"><b>${esc(r.e.email)}</b><div class="meta">Inscrito, pero aún no crea su cuenta</div></div>${label.nouser}</div>`).join('')}</div>`
    : `<div class="empty">No hay estudiantes inscritos en este curso. <a href="#/curso/${course.id}/estudiantes">Inscribir</a></div>`}`;
}

async function studentHome(){
  const courses = (await api.courses()).filter(c => !c.archived);
  if (!courses.length) return `<h1>Hola, ${esc(S.profile.full_name.split(' ')[0] || '')} 👋</h1>

  const all = await Promise.all(courses.map(c => api.assignments(c.id)));
  const msgs = await api.messages({student_id: S.user.id});
  const threads = groupBy(msgs, m => m.assignment_id);
  const next = all.flat()
    .map(a => ({a, st: threadStatus(threads[a.id], S.user.id)}))
    .filter(x => x.st === 'pending' || (x.st === 'done' && isNewFeedback(threads[x.a.id])));
  const C = Object.fromEntries(courses.map(c => [c.id, c]));
  return `<h1>Hola, ${esc(S.profile.full_name.split(' ')[0] || '')} 👋</h1>
  <p class="sub">Tus cursos y tus journals de la semana.</p>
  ${next.length ? `<h2>Para hacer</h2><div class="list">${next.map(({a, st}) => `<a class="row" href="#/tarea/${a.id}">
     <div class="grow"><b>${esc(a.title)}</b><div class="meta">${esc(C[a.course_id].title)}${a.due_date ? ' · Entrega: ' + fmtDate(a.due_date) : ''}</div></div>
     ${st === 'pending' ? '<span class="badge warn">Pendiente</span>' : '<span class="badge new">Nuevo feedback</span>'}</a>`).join('')}</div>` : ''}
  <h2>Mis cursos</h2>
  <div class="grid">${courses.map((c, i) => `<a class="card course-card" href="#/curso/${c.id}"><div class="bar" style="background:${esc(c.color)}"></div>${coverDiv(c.image_url, 'cover')}
    <h3>${esc(c.title)}</h3><p>${all[i].length} tarea${all[i].length===1?'':'s'}</p></a>`).join('')}</div>
  ${joinForm()}`;
}
function joinForm(){
  return `<h2>¿Te inscribiste a otro curso?</h2>
  <form class="card" id="join-form"><label style="margin-top:0">Escribe el código que te dio tu profe</label>
    <div class="join"><input type="text" name="code" placeholder="OTW-XXXXXX" autocomplete="off" required><button class="btn primary">Unirme</button></div></form>`;
}
// "Nuevo feedback" = la profe respondió y el estudiante no ha abierto el hilo desde entonces
function seenKey(aid){ return 'otw-seen-' + S.user.id + '-' + aid; }
function isNewFeedback(thread){
  const last = thread[thread.length - 1];
  let seen = null; try { seen = localStorage.getItem(seenKey(last.assignment_id)); } catch (e) {}
  return !seen || seen < last.created_at;
}
async function studentCourse(id){
  const [course, assignments, msgs, sessions] = await Promise.all([api.course(id), api.assignments(id), api.messages({student_id: S.user.id}), api.sessions(id).catch(() => [])]);
  if (!course) throw new Error('No tienes acceso a este curso.');
  const myAtt = sessions.length ? Object.fromEntries((await api.attendance(sessions.map(x => x.id)).catch(() => [])).map(a => [a.session_id, a.status])) : {};
  const nowIso = new Date().toISOString();
  const attBadge = x => myAtt[x.id] ? `<span class="badge ${myAtt[x.id] === 'present' ? 'ok' : myAtt[x.id] === 'absent' ? '' : 'warn'}">${ATT[myAtt[x.id]]}</span>` : (x.starts_at > nowIso ? '<span class="badge">Próxima</span>' : '');
  const classesHtml = sessions.length ? `<h2>Clases</h2><div class="list">${sessions.map(x => `<div class="row">${dateChip(x.starts_at)}
    <div class="grow"><b>${esc(x.title || 'Clase')}</b><div class="meta">${esc(fmtSession(x.starts_at))}</div>${x.notes ? `<div class="meta">${fmtText(x.notes)}</div>` : ''}</div>${attBadge(x)}</div>`).join('')}</div>` : '';
  const threads = groupBy(msgs, m => m.assignment_id);
  const weeks = groupBy(assignments, a => a.week);
  const badge = a => { const st = threadStatus(threads[a.id], S.user.id);
    if (st === 'pending') return '<span class="badge warn">Pendiente</span>';
    if (st === 'done' && isNewFeedback(threads[a.id])) return '<span class="badge new">Nuevo feedback</span>';
    return st === 'done' ? '<span class="badge ok">Con feedback</span>' : '<span class="badge ok">Enviado</span>'; };
  return `<div class="crumb"><a href="#/">Inicio</a> / Curso</div>${coverDiv(course.image_url, 'course-cover')}
  <h1 style="display:flex;align-items:center;gap:10px"><span style="width:12px;height:12px;border-radius:50%;background:${esc(course.color)}"></span>${esc(course.title)}</h1>
  <p class="sub">${esc(course.description)}</p>
  ${assignments.length ? Object.keys(weeks).sort((a, b) => a - b).map(w => `<div class="week">Semana ${w}</div><div class="list">${weeks[w].map(a => `
    <a class="row" href="#/tarea/${a.id}"><div class="grow"><b>${esc(a.title)}</b><div class="meta">${a.due_date ? 'Entrega: ' + fmtDate(a.due_date) : 'Sin fecha límite'}</div></div>${badge(a)}</a>`).join('')}</div>`).join('')
    : `<div class="empty">Tu profe aún no ha publicado tareas en este curso.</div>`}
  ${classesHtml}`;
}

/* ---------------- HILO DEL JOURNAL (profe y estudiante) ---------------- */
async function threadView(aid, sid){
  const a = await api.assignment(aid);
  if (!a) throw new Error('Esta tarea no existe o aún no está publicada.');
  const [course, msgs, profiles] = await Promise.all([api.course(a.course_id), api.messages({assignment_id: aid, student_id: sid}), api.profiles()]);
  const urls = await api.fileUrls(msgs.filter(m => m.file_path).map(m => m.file_path));
  const Pm = Object.fromEntries(profiles.map(p => [p.id, p]));
  const student = Pm[sid];
  PAGE.thread = {a, sid, msgs};
  if (!isTeacher() && msgs.length) { try { localStorage.setItem(seenKey(aid), new Date().toISOString()); } catch (e) {} }
  const author = m => m.author_id === sid ? (student?.full_name || 'Estudiante') : (Pm[m.author_id]?.full_name || CONFIG.TEACHER_NAME);
  const media = m => { if (!m.file_path) return ''; const u = urls[m.file_path]; if (!u) return `<div class="note">📎 ${esc(m.file_name)}</div>`;
    return (m.file_type || '').startsWith('video') ? `<video src="${esc(u)}" controls playsinline preload="metadata"></video>`
         : `<audio src="${esc(u)}" controls preload="metadata"></audio>`; };
  return `<div class="crumb"><a href="#/">Inicio</a> / <a href="#/curso/${course.id}">${esc(course.title)}</a>${isTeacher() ? ` / <a href="#/tarea/${a.id}">${esc(a.title)}</a>` : ''}</div>
  <h1>${isTeacher() ? esc(student?.full_name || 'Estudiante') : esc(a.title)}</h1>
  <p class="sub">${isTeacher() ? esc(a.title) : 'Semana ' + a.week}${a.due_date ? ' · Entrega: ' + fmtDate(a.due_date) : ''}</p>
  ${isTeacher() ? `<details><summary class="note" style="cursor:pointer">Ver instrucciones</summary><div class="instructions" style="margin-top:8px">${fmtText(a.instructions)}</div></details>`
                : `<div class="instructions">${fmtText(a.instructions) || '<span class="note">Sin instrucciones.</span>'}</div>`}
  <div class="thread">
    ${msgs.length ? msgs.map(m => `<div class="msg ${m.author_id === S.user.id ? 'mine' : ''}">
      <div class="head"><b>${esc(author(m))}</b><span>${fmtWhen(m.created_at)}</span>
      ${m.author_id === S.user.id || isTeacher() ? `<button class="del" data-act="del-msg" data-id="${m.id}">Borrar</button>` : ''}</div>
      ${m.body ? `<div>${fmtText(m.body)}</div>` : ''}${ytIds(m.body).map(ytEmbed).join('')}${media(m)}</div>`).join('')
      : `<div class="empty">${isTeacher() ? 'Este estudiante aún no ha respondido. Puedes escribirle primero si quieres.' : 'Escribe tu primera entrada del journal. Puedes pegar el link de tu video en YouTube o grabar un audio.'}</div>`}
  </div>
  <form class="composer" id="composer">
    <textarea name="body" placeholder="${isTeacher() ? 'Escribe tu feedback…' : '¿Cómo te fue esta semana?'}"></textarea>
    <div class="yt-input">▶<input type="text" name="yt" inputmode="url" placeholder="Pega el link de tu video de YouTube (opcional)"></div>
    <div class="tools">
      <label class="btn small" style="margin:0;color:var(--text)">🎧 Subir audio<input type="file" name="file" accept="audio/*" hidden></label>
      <button type="button" class="btn small" id="rec-btn">🎙️ Grabar audio</button>
      <span class="file-chip" id="file-chip"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="send-btn">Enviar</button>
    </div>
  </form>
  <details class="help"><summary>¿Cómo subo mi video a YouTube sin que sea público?</summary><ol>
    <li>En la app de YouTube toca <b>+</b> → <b>Video</b> y elige tu video (en compu: <b>Crear → Subir video</b>).</li>
    <li>En <b>Visibilidad</b> elige <b>Oculto</b> (Unlisted): solo lo ve quien tenga el link.</li>
    <li>Cuando termine de subir, toca <b>Compartir → Copiar link</b>.</li>
    <li>Pégalo aquí arriba y envía. El video aparece listo para ver dentro del journal.</li>
  </ol></details>
  <p class="note">Los audios (grabados o subidos) pueden pesar hasta ${MAX_MB} MB.</p>`;
}

/* ---------------- interacción de cada página ---------------- */

  const pf = $('#pass-form'); if (pf) pf.onsubmit = async e => { e.preventDefault();
    try { await api.updatePassword(new FormData(pf).get('p')); pf.reset(); toast('Contraseña actualizada'); } catch (x) { toast(errMsg(x)); } };
  const jf = $('#join-form'); if (jf) jf.onsubmit = async e => { e.preventDefault();
    try { const id = await api.joinCourse(normCode(new FormData(jf).get('code'))); toast('¡Listo! Ya estás en el curso'); location.hash = '#/curso/' + id; }
    catch (x) { toast(errMsg(x)); } };
  const lo = $('#logout'); if (lo) lo.onclick = async () => { await api.signOut(); location.hash = '#/'; };
  bindComposer();
  bindAttendance();
}

function bindComposer(){
  const form = $('#composer'); if (!form) return;
  let picked = null, rec = null, chunks = [];
  const chip = $('#file-chip'), fileInput = form.querySelector('input[type=file]'), recBtn = $('#rec-btn');
  const showFile = f => { picked = f; chip.innerHTML = f ? `📎 ${esc(f.name)} (${(f.size/1048576).toFixed(1)} MB) <button type="button" class="btn small" id="rm-file">✕</button>` : '';
    const rm = $('#rm-file'); if (rm) rm.onclick = () => { fileInput.value = ''; showFile(null); }; };
  fileInput.onchange = () => { const f = fileInput.files[0];
    if (f && !f.type.startsWith('audio')) { toast('Aquí solo van audios. Los videos súbelos a YouTube y pega el link.'); fileInput.value = ''; return; }
    if (f && f.size > MAX_MB * 1048576) { toast(`Ese archivo pesa más de ${MAX_MB} MB.`); fileInput.value = ''; return; } showFile(f || null); };
  if (!window.MediaRecorder || !navigator.mediaDevices) recBtn.hidden = true;
  recBtn.onclick = async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
      chunks = []; rec = new MediaRecorder(stream);
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onstop = () => { stream.getTracks().forEach(t => t.stop());
        const type = (rec.mimeType || 'audio/webm').split(';')[0]; const ext = type.includes('mp4') ? 'm4a' : type.includes('ogg') ? 'ogg' : 'webm';
        showFile(new File(chunks, `grabacion-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.${ext}`, {type}));
        rec = null; recBtn.textContent = '🎙️ Grabar audio'; recBtn.classList.remove('rec'); };
      rec.start(); recBtn.textContent = '⏹ Detener'; recBtn.classList.add('rec');
    } catch (e) { toast('No se pudo acceder al micrófono.'); }
  };
  form.onsubmit = async e => {
    e.preventDefault();
    const yt = form.yt.value.trim();
    if (yt && !ytIds(yt).length) { toast('Ese no parece un link de YouTube. Revísalo o pégalo en el texto.'); return; }
    const body = [form.body.value.trim(), yt].filter(Boolean).join('\n\n');
    if (!body && !picked) { toast('Escribe algo, pega un link o adjunta un audio.'); return; }
    if (rec) { toast('Detén la grabación primero.'); return; }
    const btn = $('#send-btn'); btn.disabled = true; btn.textContent = picked ? 'Subiendo…' : 'Enviando…';
    try {
      await api.sendMessage({assignment_id: PAGE.thread.a.id, student_id: PAGE.thread.sid, author_id: S.user.id, body, file: picked});
      toast('Enviado ✓'); render();
    } catch (x) { toast(errMsg(x)); btn.disabled = false; btn.textContent = 'Enviar'; }
  };
}

/* ---------------- modales ---------------- */
function modal(html, onMount){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const close = () => root.innerHTML = '';
  root.querySelector('.modal-bg').onclick = e => { if (e.target.classList.contains('modal-bg')) close(); };
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  onMount(root.querySelector('.modal'), close);
}

function courseForm(c = {}){
  let color = c.color || COLORS[0];
  modal(`<h2>${c.id ? 'Editar curso' : 'Nuevo curso'}</h2><form id="cf">
    <label>Nombre del curso</label><input type="text" name="title" required value="${esc(c.title || '')}" placeholder="Curso DJ · Enero 2027">
    <label>Descripción corta</label><input type="text" name="description" value="${esc(c.description || '')}" placeholder="Lunes 6–9 pm · Flux Studios">
    <label>Foto de portada (opcional)</label><input type="text" name="image_url" value="${esc(c.image_url || '')}" placeholder="Pega el link de una imagen, o: piano.jpg">
    <div class="cover-preview" id="cover-prev" style="${c.image_url ? `background-image:url('${coverUrl(c.image_url)}')` : 'display:none'}"></div>
    <label>Color</label><div class="swatches">${COLORS.map(x => `<button type="button" data-c="${x}" style="background:${x}" class="${x===color?'on':''}"></button>`).join('')}</div>
    ${c.id ? `<label class="check" style="margin-top:14px"><input type="checkbox" name="archived" ${c.archived ? 'checked' : ''}> Archivar (lo ocultas a estudiantes y lo mueves abajo)</label>` : ''}
    <div class="actions"><button class="btn primary">Guardar</button><button type="button" class="btn" data-close>Cancelar</button>
      ${c.id ? '<span class="spacer"></span><button type="button" class="btn danger" id="del-course">Eliminar</button>' : ''}</div></form>`,
  (m, close) => {
    m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; m.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); });
    const iu = m.querySelector('[name=image_url]'), pv = m.querySelector('#cover-prev');
    iu.oninput = () => { const v = iu.value.trim(); pv.style.display = v ? '' : 'none'; pv.style.backgroundImage = v ? `url('${encodeURI(v).replace(/'/g, '%27')}')` : ''; };
    m.querySelector('#cf').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
      const saved = await api.saveCourse({id: c.id, title: f.get('title').trim(), description: f.get('description').trim(), color, archived: f.get('archived') === 'on', image_url: f.get('image_url').trim()});
      close(); toast('Curso guardado'); if (!c.id) location.hash = '#/curso/' + saved.id; else render(); };
    const d = m.querySelector('#del-course'); if (d) d.onclick = async () => {
      if (!confirm('¿Eliminar el curso con todas sus tareas y journals? Esto no se puede deshacer. (Si solo quieres ocultarlo, usa “Archivar”.)')) return;
      await api.deleteCourse(c.id); close(); location.hash = '#/'; };
  });
}

function assignmentForm(a = {}){
  const nextWeek = a.week || Math.max(0, ...(PAGE.assignments || []).map(x => x.week)) + 1 || 1;
  modal(`<h2>${a.id ? 'Editar tarea' : 'Nueva tarea'}</h2><form id="af">
    <div style="display:grid;grid-template-columns:110px 1fr;gap:12px">
      <div><label>Semana</label><input type="number" name="week" min="0" value="${nextWeek}" required></div>
      <div><label>Fecha de entrega (opcional)</label><input type="date" name="due_date" value="${esc(a.due_date || '')}"></div></div>
    <label>Título</label><input type="text" name="title" required value="${esc(a.title || (a.id ? '' : 'Practice Journal · Semana ' + nextWeek))}">
    <label>Instrucciones</label><textarea name="instructions" style="min-height:170px" placeholder="Corto y claro: 2–3 cosas para practicar esta semana.">${esc(a.instructions || '')}</textarea>
    <label class="check" style="margin-top:14px"><input type="checkbox" name="published" ${a.published ? 'checked' : ''}> Publicada (visible para los estudiantes)</label>
    <div class="actions"><button class="btn primary">Guardar</button><button type="button" class="btn" data-close>Cancelar</button>
      ${a.id ? '<span class="spacer"></span><button type="button" class="btn danger" id="del-a">Eliminar</button>' : ''}</div></form>`,
  (m, close) => {
    m.querySelector('#af').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
      await api.saveAssignment({id: a.id, course_id: a.course_id || PAGE.course.id, week: +f.get('week'), title: f.get('title').trim(),
        instructions: f.get('instructions'), due_date: f.get('due_date') || null, published: f.get('published') === 'on'});
      close(); toast('Tarea guardada'); render(); };
    const d = m.querySelector('#del-a'); if (d) d.onclick = async () => {
      if (!confirm('¿Eliminar esta tarea y todas las respuestas de los estudiantes?')) return;
      await api.deleteAssignment(a.id); close(); location.hash = '#/curso/' + a.course_id; render(); };
  });
}

async function duplicateForm(a){
  const courses = (await api.courses()).filter(c => !c.archived || c.id === a.course_id);
  modal(`<h2>Duplicar tarea</h2><p class="note">Se crea una copia como borrador. Ideal para reusar tu plantilla de Practice Journal.</p><form id="df">
    <label>Copiar al curso</label><select name="course">${courses.map(c => `<option value="${c.id}" ${c.id===a.course_id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>
    <div style="display:grid;grid-template-columns:110px 1fr;gap:12px">
      <div><label>Semana</label><input type="number" name="week" min="0" value="${a.week + 1}"></div>
      <div><label>Título</label><input type="text" name="title" value="${esc(a.title.replace(/(Semana\s*)\d+/i, (_, s) => s + (a.week + 1)))}"></div></div>
    <div class="actions"><button class="btn primary">Duplicar</button><button type="button" class="btn" data-close>Cancelar</button></div></form>`,
  (m, close) => {
    m.querySelector('#df').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target);
      await api.saveAssignment({course_id: f.get('course'), week: +f.get('week'), title: f.get('title').trim(), instructions: a.instructions, due_date: null, published: false});
      close(); toast('Copia creada como borrador'); location.hash = '#/curso/' + f.get('course'); render(); };
  });
}

const actions = {
  'new-course': () => courseForm(),
  'edit-course': () => courseForm(PAGE.course),
  'new-assignment': () => assignmentForm({course_id: PAGE.course.id}),
  'edit-assignment': async id => assignmentForm(await api.assignment(id)),
  'dup-assignment': async id => duplicateForm(await api.assignment(id)),
  'toggle-publish': async id => { const a = await api.assignment(id); await api.saveAssignment({id, published: !a.published});
    toast(a.published ? 'Volvió a borrador' : 'Publicada ✓'); render(); },
  'add-emails': async () => {
    const emails = [...new Set($('#emails').value.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)))];
    if (!emails.length) { toast('No encontré emails válidos.'); return; }
    await api.addEnrollments(PAGE.course.id, emails);
    const have = new Set((await api.profiles()).map(p => p.email));
    let sent = 0, fail = 0;
    for (const em of emails.filter(x => !have.has(x))) { try { await api.inviteStudent(em, PAGE.course.title); sent++; } catch (x) { console.error(x); fail++; } }
    toast(`${emails.length} inscrito${emails.length===1?'':'s'}` + (sent ? ` · ${sent} invitación${sent===1?'':'es'} enviada${sent===1?'':'s'}` : '') + (fail ? ` · ${fail} no se pudo enviar` : ''));
    render(); },
  'invite': async (email, el) => {
    el.disabled = true; el.textContent = 'Enviando…';
    try { await api.inviteStudent(email, PAGE.course.title); el.textContent = '✓ Invitación enviada'; toast('Invitación enviada a ' + email); }
    catch (x) { el.disabled = false; el.textContent = '✉️ Enviar invitación'; toast(/rate|seconds/i.test(x.message || '') ? 'Espera un minuto antes de reenviar.' : errMsg(x)); } },
  'new-session': () => sessionForm({course_id: PAGE.course.id}),
  'new-sessions-weekly': () => weeklySessionsForm(),
  'edit-session': () => sessionForm(PAGE.session),
  'all-present': async () => { const boxes = [...document.querySelectorAll('.att')];
    for (const box of boxes) { box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.st === 'present'));
      await api.setAttendance(PAGE.session.id, box.dataset.email, 'present'); }
    updateAttCounts(); toast('Todos presentes ✓'); },
  'unenroll': async id => { if (!confirm('¿Quitar a este estudiante del curso? Sus journals se conservan.')) return; await api.removeEnrollment(id); render(); },
  'copy-invite': async () => { const c = PAGE.course;
    const text = `¡Hola! 🎶 Bienvenid@ a ${c.title} de On the Wave.\n\nCrea tu cuenta en nuestro campus aquí:\n${inviteLink(c.join_code)}\n\nTu código de inscripción es: ${c.join_code}\n\nAhí vas a encontrar las tareas de cada semana y tu journal de práctica.`;
    try { await navigator.clipboard.writeText(text); toast('Invitación copiada. Pégala en WhatsApp'); } catch (e) { prompt('Copia este mensaje:', text); } },
  'toggle-code': async () => { await api.saveCourse({id: PAGE.course.id, join_enabled: !PAGE.course.join_enabled});
    toast(PAGE.course.join_enabled ? 'Código pausado' : 'Código activo'); render(); },
  'new-code': async () => { if (!confirm('¿Generar un código nuevo? El anterior deja de funcionar (los estudiantes que ya están inscritos no se afectan).')) return;
    await api.saveCourse({id: PAGE.course.id, join_code: genCode(), join_enabled: true}); toast('Código nuevo listo'); render(); },
  'copy-link': async () => { try { await navigator.clipboard.writeText(baseUrl()); toast('Link copiado'); } catch (e) { prompt('Copia este link:', baseUrl()); } },
  'del-msg': async id => { const m = PAGE.thread.msgs.find(x => x.id === id); if (!m || !confirm('¿Borrar este mensaje?')) return;
    await api.deleteMessage(m); render(); }
};
</script>
